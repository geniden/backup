[package]
name = "backup-decrypt"
version = "1.0.0"
edition = "2021"
authors = ["Emelyanov Anton <geniden@gmail.com>"]
homepage = "https://github.com/geniden"
license = "MIT"
description = "Decrypt backup-server .aes archives (AES-256-GCM, BACKUPENC1)"
build = "build.rs"

[[bin]]
name = "backup-decrypt"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2.5"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
