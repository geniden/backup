[package]
name = "backup-client"
version = "1.0.0"
edition = "2021"
authors = ["Emelyanov Anton <geniden@gmail.com>"]
homepage = "https://github.com/geniden"
license = "MIT"
default-run = "backup-client"
build = "build.rs"

[lib]
name = "backup_client"
path = "src/lib.rs"

[[bin]]
name = "backup-client"
path = "src/main.rs"

[[bin]]
name = "backup-monitor"
path = "src/bin/backup-monitor.rs"
required-features = ["monitor"]

[features]
default = ["monitor"]
monitor = ["dep:ratatui", "dep:crossterm"]

[build-dependencies]
embed-resource = "2.5"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
tokio-cron-scheduler = "0.11"
cron = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.6", features = ["v4"] }
once_cell = "1.19"
sha2 = "0.11.0"
hex = "0.4"
machine-uid = "0.6"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rand = "0.8"
time = "0.3"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[target.'cfg(windows)'.dependencies]
wmi = "0.14"
